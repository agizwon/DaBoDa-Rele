name: 개선 요청 (Feature request)
description: 있었으면 하는 기능이나 불편한 점을 알려 주세요 (A feature you would like, or something inconvenient)
title: "[요청] "
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: 바라는 것 (What you would like)
      description: 어떤 상황에서 무엇이 되면 좋겠는지 적어 주세요 (In what situation, and what should happen)
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 어디에서 (Where)
      options:
        - Windows
        - Android 폰 (phone)
        - 둘 다 (both)
  - type: input
    id: version
    attributes:
      label: 쓰고 있는 버전 (Version you use)
      placeholder: "0.1.8"
  - type: markdown
    attributes:
      value: |
        개인 정보나 회사 자료가 든 파일·화면은 올리지 마세요. 이 저장소는 누구나 볼 수 있습니다.
        Please do not attach files or screenshots with personal or company information. This repository is public.
